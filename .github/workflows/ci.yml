name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    env:
      # El binario de Electron no hace falta para compilar ni probar.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      DATABASE_URL: postgresql://sgt:sgt@localhost:5432/sgt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Validar esquema de base de datos
        run: npx prisma validate
        working-directory: apps/api
      - name: Pruebas del motor de reglas
        run: npm test
      - name: Compilar paquetes y aplicaciones
        run: npm run build
